services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ms_sqlserver_erp
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword@123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql

  # dbgate:
  #   image: dbgate/dbgate:latest
  #   container_name: dbgate_erp
  #   ports:
  #     - "3005:3000"

volumes:
  sqlserverdata: